; SkyLarkESP32: WindowsApp/SkyLark のゲームを Livico と同じ機体で遊ぶ
; ESP32-S3-DevKitC-1 N16R8 (Flash 16MB QIO / PSRAM 8MB Octal)、ST7789 240x320 (縦置き)、MAX98357A、SW1〜SW3、ジョイスティック
[platformio]
default_envs = skylark

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
  -DBOARD_HAS_PSRAM
  -std=gnu++17
  -O2
; 書き込みは内蔵 USB (USB 端子) でできる。ゲームのシリアル出力 (速さの記録、画面の写し) も内蔵 USB に出す
; upload_port = COM7
lib_deps =
  moononournation/GFX Library for Arduino@1.4.7

; ゲーム
[env:skylark]
monitor_speed = 921600
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*>

; ジョイスティックの試験 (pio run -e joytest -t upload)
[env:joytest]
monitor_speed = 115200
build_src_filter = -<*> +<../test_joy/joytest.cpp>
