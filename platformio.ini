; SkyLarkESP32: WindowsApp/SkyLark のゲームを Livico と同じ機体で遊ぶ
; ESP32-S3-DevKitC-1 N16R8 (Flash 16MB QIO / PSRAM 8MB Octal)、ST7789 240x320 (縦置き)、MAX98357A、SW1〜SW3、ジョイスティック
[platformio]
default_envs = game_nobl

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; TinyUSB で動いているときは、1200bps で開いて閉じる合図で書き込みの待ち受けに入る (DTR/RTS では入らない)
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_unflags = -std=gnu++11
build_flags =
  -DBOARD_HAS_PSRAM
  -std=gnu++17
  -O2
; 書き込みは内蔵 USB (USB 端子) でできる。ゲームのシリアル出力 (速さの記録、画面の写し) も内蔵 USB に出す
; upload_port = COM7
lib_deps =
  moononournation/GFX Library for Arduino@1.4.7

; 液晶は 2 種類あり、ゲームと試験のファームをそれぞれに用意する
;   _nobl … BL 端子のない液晶 (Livico と同じ。色反転 true)
;   _bl   … BL 端子のある液晶 (InfoPanel 初号機・TFT-VUMeterTester-240-320 と同じ。色反転 false、BL は GPIO7。3.3V に直結してもよい)
; 配線は BL のほかは同じ。書き込むときは液晶に合わせて選ぶ (VS Code ではステータスバーの env を切り替える)

; ゲーム (BL なしの液晶)  pio run -e game_nobl -t upload
[env:game_nobl]
monitor_speed = 921600
; ARDUINO_USB_MODE=0: 内蔵 USB を TinyUSB で動かす (ジョイスティックのモードでゲームパッドになるため。シリアルも同時に出る)
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*>

; ゲーム (BL ありの液晶)  pio run -e game_bl -t upload
[env:game_bl]
extends = env:game_nobl
build_flags =
  ${env:game_nobl.build_flags}
  -DTFT_IPS=false
  -DTFT_BL=7

; ジョイスティックの試験 (BL なしの液晶)  pio run -e joytest_nobl -t upload
[env:joytest_nobl]
monitor_speed = 115200
build_src_filter = -<*> +<../test_joy/joytest.cpp>

; ジョイスティックの試験 (BL ありの液晶)  pio run -e joytest_bl -t upload
[env:joytest_bl]
extends = env:joytest_nobl
build_flags =
  ${env.build_flags}
  -DTFT_IPS=false
  -DTFT_BL=7
